<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<title>{{ station }} tides</title>
<script type="module" src="{{ datastar }}"></script>
<style>
  :root{
    --ground:#0d1b26; --panel:#122434; --line:#1d3245;
    --ink:#eaf1f6; --muted:#8ea3b4;
    --accent:#5fcfc0; --high:#7fb8ff; --low:#e2b06a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}

  /* type primitives: everything on the page composes from these.
     sizes: h1 (display) / base / small / h2+.label (caps eyebrow).
     weights: 400 and 650. numerals tabular throughout. */
  body{
    background:var(--ground); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    font-variant-numeric:tabular-nums;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1{font-size:clamp(2.6rem,14vw,3.4rem);font-weight:650;line-height:1.05;
    letter-spacing:-.02em;margin:0}
  h2,.label{font-size:.75rem;font-weight:650;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0}
  p{margin:0}
  small{font-size:.85rem;color:var(--muted)}
  b{font-weight:650}
  a{color:var(--accent);font-weight:650;text-decoration:none}

  /* the only other color channel: tide kind */
  .high,.rising{color:var(--high)}
  .low,.falling{color:var(--low)}

  /* layout */
  .wrap{max-width:27rem;margin:0 auto;padding:1rem 1.1rem 2.5rem;
    display:flex;flex-direction:column;gap:1.4rem}

  header{display:flex;flex-direction:column;gap:.4rem}
  select{width:100%;font:inherit;font-weight:650;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:.6rem .8rem;appearance:none;-webkit-appearance:none}
  .sub{display:flex;justify-content:space-between;align-items:baseline;padding:0 .15rem}

  .hero{display:flex;flex-direction:column;gap:.15rem;padding:.3rem .15rem 0}
  .times{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}

  .chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:.9rem .9rem .6rem}
  .chart svg{display:block;width:100%;height:150px}
  .chart .area{fill:rgba(95,207,192,.14)}
  .chart .curve{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
  .chart .nowline{stroke:rgba(234,241,246,.28);stroke-width:1.5;stroke-dasharray:3 4}
  .chart .nowdot{fill:var(--ink);stroke:var(--ground);stroke-width:3}
  .chart .dot.high{fill:var(--high)} .chart .dot.low{fill:var(--low)}
  .axis{display:flex;justify-content:space-between;padding:.45rem .1rem 0}
  .axis small{opacity:.7}

  .today{display:flex;gap:.6rem}
  .chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:.55rem .25rem;display:flex;flex-direction:column;align-items:center;gap:.05rem}
  .chip b{white-space:nowrap}
  .chip.past{opacity:.42}

  /* 7-day table: day label + one column per tide of the day, so the k-th
     tide lines up down the page. cells stack time over height. */
  .week h2{margin:0 0 .5rem .15rem}
  .day{display:grid;grid-template-columns:4.6rem repeat(4,1fr);gap:0 .5rem;
    padding:.55rem .15rem;border-top:1px solid var(--line);align-items:baseline}
  .day.today{background:linear-gradient(90deg,rgba(95,207,192,.07),transparent);
    border-radius:8px}
  .day.today > small{color:var(--accent);font-weight:650}
  .cell{display:flex;flex-direction:column}
  .cell b{white-space:nowrap}

  footer{text-align:center;line-height:1.6}
  footer small{opacity:.8}
  footer a{color:var(--muted);text-decoration:underline;
    text-decoration-color:var(--line);font-weight:400}
</style>
</head>
<body data-init="@get('/sse?s={{ code }}')">
<div class="wrap">
  <header>
    <form method="get">
      <select name="s" onchange="this.form.submit()" aria-label="tide station">
        {% for st in stations %}
        <option value="{{ st.code }}"{% if st.code == code %} selected{% endif %}>{{ st.name }}</option>
        {% endfor %}
      </select>
      <noscript><button>go</button></noscript>
    </form>
    <p class="sub"><small>{{ date_label }}</small><a href="/map">map</a></p>
  </header>

  {{ live|safe }}

  <section class="week">
    <h2>next 7 days &middot; m</h2>
    {% for d in days %}
    <div class="day{% if d.today %} today{% endif %}">
      <small>{{ d.label }}</small>
      {% for e in d.events %}
      <div class="cell">
        <b class="{{ e.kind }}">{{ e.time }}</b>
        <small>{{ e.height }}</small>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </section>

  <footer>
    <small>
      <a href="https://www.tides.gc.ca/en/stations/{{ code }}">CHS predictions</a>,
      heights above chart datum<br>
      {{ station }} &middot; updated {{ updated }}
    </small>
  </footer>
</div>
</body>
</html>
