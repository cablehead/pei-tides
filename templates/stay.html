<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<title>the stay &middot; tides</title>
<link rel="stylesheet" href="/style.css">
<style>
  .cards{display:flex;flex-direction:column;gap:1.1rem}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;scroll-margin-top:1rem}
  figure img{display:block;width:100%;height:auto}
  figcaption{padding:.7rem .9rem .8rem;display:flex;flex-direction:column;gap:.1rem}

  .days{display:flex;flex-direction:column;gap:.15rem}
  .drow{display:grid;grid-template-columns:3.4rem 1fr;gap:.6rem;
    align-items:center;scroll-margin-top:1rem}
  .drow.today small{color:var(--accent);font-weight:650}
  .drow svg{display:block;width:100%;height:44px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px}
  .drow .curve{stroke:var(--accent);stroke-width:2;fill:none;opacity:.8}
  .drow .pdot{fill:var(--photo);stroke:var(--ground);stroke-width:2}

  @media (max-width:639px){
    figure{border-inline:0;border-radius:0}
    .drow{padding-left:var(--gutter)}
    .drow svg{border-right:0;border-radius:8px 0 0 8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>the stay</h1>
    <p class="sub">
      <small>{{ range_label }} &middot; {{ station_label }}</small>
      <a href="/">&larr; tides</a>
    </p>
  </header>

  <section class="cards bleed">
    {% if not photos %}
    <small>no photos yet -- ingest with: nu tools/ingest.nu &lt;originals&gt;</small>
    {% endif %}
    {% for p in photos %}
    <figure id="p-{{ p.stem }}">
      <img src="/photos/{{ p.file }}" loading="lazy" alt="beach at {{ p.height }} m">
      <figcaption>
        <b>{{ p.height }} m &middot; <span class="{{ p.phase }}">{{ p.phase }}</span></b>
        <small><a href="#d-{{ p.day }}">{{ p.when }}</a></small>
        <small>{{ p.between }}</small>
      </figcaption>
    </figure>
    {% endfor %}
  </section>

  <section class="days bleed" aria-label="each day's curve, dots are photos">
    {% for d in days %}
    <div class="drow{% if d.today %} today{% endif %}" id="d-{{ loop.index0 }}">
      <small>{{ d.label }}</small>
      <svg viewBox="0 0 720 80" preserveAspectRatio="none">
        <polyline class="curve" points="{{ d.points }}"/>
        {% for p in d.dots %}
        <a href="#p-{{ p.stem }}"><circle class="pdot" cx="{{ p.x }}" cy="{{ p.y }}" r="7"/></a>
        {% endfor %}
      </svg>
    </div>
    {% endfor %}
  </section>

  <footer><small>heights above chart datum, midpoint of Canoe Cove and Victoria</small></footer>
</div>
</body>
</html>
